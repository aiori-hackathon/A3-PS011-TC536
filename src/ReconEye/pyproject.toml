[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ps011"
version = "0.1.0"
description = "PS-011: External-asset monitoring and change-detection tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dnspython>=2.6.0",
    "cryptography>=42.0.0",
    "fastapi>=0.110.0",
    "sqlalchemy>=2.0.0",
    "apscheduler>=3.10.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
ps011 = "ps011.cli:main"
